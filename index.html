<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0B1A" id="themeMeta">
<title>Diagnóstico de Maturidade do TCC | Prof. Dr. André Batalhão</title>
<meta name="description" content="Diagnóstico de maturidade de TCC em Administração com 24 questões baseadas em literatura de periódicos de topo (ABS 4/4*), assistente Dr. Andrezinho e relatório em PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D0B1A; --ink2:#17132E; --ink3:#241E45; --paper:#F4F1FA; --mut:#B7B1D6; --mutd:#5B5675;
  --saf:#FFB81C; --ultra:#3341D1;
  --page:#0D0B1A; --c:#3341D1; --fg:#fff; --veil:rgba(255,255,255,.14); --vline:rgba(255,255,255,.42);
  --navh:84px;
  --sans:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--page);transition:background-color .5s}
body{margin:0;font-family:var(--sans);color:var(--fg);background:var(--page);transition:background-color .5s,color .3s;line-height:1.5;font-size:16px;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saf);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}
.logo-w{filter:invert(1)}

/* topo */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;height:54px}
.top img{width:32px;height:32px}
.top .ttl{font-weight:700;font-size:15px;line-height:1.1;letter-spacing:-.01em;min-width:0}
.top .ttl small{display:block;font-weight:500;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .cnt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.spec{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:0 0 0;align-items:end;height:12px}
.spec button{border:0;padding:0;height:5px;background:var(--sc);opacity:.32;cursor:pointer;border-radius:3px 3px 0 0;transition:height .25s,opacity .25s}
.spec button.done{opacity:1}
.spec button.cur{opacity:1;height:11px}
.spec.flat button{opacity:1;height:6px;cursor:default}

main{padding:26px 0 calc(var(--navh) + 200px)}
main.noNav{padding-bottom:230px}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.in{animation:slideIn .32s cubic-bezier(.2,.8,.2,1)}
.inb{animation:slideBack .32s cubic-bezier(.2,.8,.2,1)}

/* intro */
.ringwrap{position:relative;width:min(280px,72vw);margin:6px 0 20px}
.ringwrap svg{display:block;width:100%;height:auto;overflow:visible}
.ringwrap img{position:absolute;left:50%;top:50%;width:46%;transform:translate(-50%,-50%)}
.arc{fill:none;stroke-width:15;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .9s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
h1.big{font-size:clamp(38px,11vw,60px);line-height:.96;letter-spacing:-.04em;font-weight:800;margin:0 0 16px;max-width:11ch}
.lead{font-family:var(--serif);font-size:19.5px;line-height:1.5;margin:0 0 22px;color:#E4E0F7;max-width:50ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 26px;border-top:1px solid rgba(255,255,255,.2);border-bottom:1px solid rgba(255,255,255,.2)}
.stats div{padding:14px 10px 14px 0}
.stats div+div{padding-left:14px;border-left:1px solid rgba(255,255,255,.2)}
.stats b{display:block;font-size:30px;letter-spacing:-.03em;line-height:1;color:var(--saf)}
.stats span{font-size:13px;color:var(--mut);line-height:1.25;display:block;margin-top:5px}
.panel{background:var(--paper);color:var(--ink);border-radius:28px;padding:22px 20px 20px}
.panel h2{margin:0 0 2px;font-size:22px;letter-spacing:-.02em}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:13.5px;font-weight:700;margin-bottom:5px}
.field input,.field select{width:100%;border:2px solid #D3CCEA;background:#fff;border-radius:14px;padding:13px 14px;font-size:16px;color:var(--ink)}
.field input:focus,.field select:focus{border-color:var(--ultra);outline:none;box-shadow:0 0 0 4px rgba(51,65,209,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--saf);background:var(--saf);color:var(--ink);border-radius:16px;padding:14px 22px;font-weight:800;cursor:pointer;font-size:17px;min-height:54px;letter-spacing:-.01em;transition:transform .15s,background .15s}
.btn:active{transform:scale(.98)}
.btn:hover{background:#FFC847;border-color:#FFC847}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:var(--ultra);border-color:var(--ultra)}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn.block{width:100%;margin-top:18px}
.fine{font-size:13px;color:var(--mutd);margin:12px 0 0}
.panel .btn.ghost{color:var(--ink)}
.panel .btn.ghost:hover{background:rgba(13,11,26,.08)}

/* questao */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.qhead .pill{min-width:0;flex:0 1 auto}
.pill{display:inline-block;background:var(--veil);border:1.5px solid var(--vline);color:var(--fg);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:700}
.qn{font-size:14px;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.qtext{font-size:clamp(25px,6.6vw,34px);line-height:1.1;letter-spacing:-.03em;font-weight:800;margin:0 0 20px}
.opts{display:grid;gap:9px;margin:0 0 14px;padding:0;border:0}
.opt{display:grid;grid-template-columns:42px 1fr 22px;gap:12px;align-items:center;text-align:left;background:var(--veil);border:2px solid var(--vline);border-radius:18px;padding:11px 14px 11px 11px;cursor:pointer;width:100%;min-height:62px;color:var(--fg);transition:background .15s,transform .15s,border-color .15s}
.opt:active{transform:scale(.985)}
.opt .n{width:42px;height:42px;border-radius:13px;border:2px solid currentColor;display:grid;place-items:center;font-weight:800;font-size:20px}
.opt b{display:block;font-size:17px;line-height:1.1;letter-spacing:-.01em}
.opt small{font-size:14px;line-height:1.2;opacity:.85;display:block;margin-top:2px}
.opt .ck{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;opacity:.5;display:grid;place-items:center;font-size:13px;font-weight:800}
.opt[aria-checked=true]{background:#fff;border-color:#fff;color:var(--ink)}
.opt[aria-checked=true] .n{background:var(--c);border-color:var(--c);color:var(--fg)}
.opt[aria-checked=true] .ck{background:var(--ink);border-color:var(--ink);color:#fff;opacity:1}
.opt[aria-checked=true] .ck:after{content:"\2713"}
.ev{font-size:15px;background:rgba(13,11,26,.26);color:#fff;border-radius:16px;padding:12px 15px;margin-bottom:16px}
.ev b{font-weight:800}
.why{background:var(--paper);color:var(--ink);border-radius:26px;padding:20px 20px 14px;position:relative;overflow:hidden}
.why:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c)}
.why h3{margin:0 0 8px;font-size:15.5px;font-weight:800;letter-spacing:-.01em;padding-left:6px}
.why p{font-family:var(--serif);font-size:17.5px;line-height:1.55;margin:0 0 12px;padding-left:6px}
.refs{border-top:1.5px solid #DAD3EE;padding:8px 0 0 6px}
.ref{font-family:var(--serif);font-size:14.5px;line-height:1.42;padding-left:22px;text-indent:-22px;margin:7px 0;color:#2C2745}
.ref a{color:var(--ultra);overflow-wrap:anywhere;text-decoration:underline;text-underline-offset:2px}
.abs{display:inline-block;text-indent:0;font-family:var(--sans);font-size:11px;font-weight:800;background:var(--ink);color:#fff;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.askbtn{margin-top:14px;display:flex;gap:12px;align-items:center;background:var(--ink);color:#fff;border:0;border-radius:20px;padding:10px 16px 10px 10px;cursor:pointer;width:100%;text-align:left;font-weight:700;font-size:15.5px;line-height:1.2}
.askbtn svg{width:46px;height:44px;flex:none;border-radius:50%;background:var(--saf)}
.askbtn small{font-weight:500;color:var(--mut);font-size:13px}

/* navegacao */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.nav .wrap{display:flex;gap:10px}
.nav .btn{flex:1;color:var(--ink)}
.nav .btn.ghost{flex:0 0 auto;color:#fff}
.nav .btn.pulse{animation:pulse 1.2s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,184,28,.7)}100%{box-shadow:0 0 0 16px rgba(255,184,28,0)}}

/* resultado */
.rtitle{font-size:clamp(34px,10vw,52px);line-height:.98;letter-spacing:-.04em;margin:2px 0 6px;font-weight:800}
.sub{color:var(--mut);font-size:14.5px;margin:0 0 6px}
.rosette{display:block;width:100%;max-width:460px;height:auto;margin:6px auto 0}
.level{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:2px 0 6px}
.levelp{font-family:var(--serif);font-size:18px;line-height:1.45;color:#E4E0F7;margin:0 0 4px}
.sec{margin-top:30px}
.sec h2{font-size:24px;letter-spacing:-.03em;margin:0 0 12px;font-weight:800}
.tile{border-radius:24px;padding:16px 18px 16px;margin-bottom:10px;background:var(--c);color:var(--fg);display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start}
.tile .pct{font-size:46px;font-weight:800;letter-spacing:-.05em;line-height:.95;grid-row:span 2;font-variant-numeric:tabular-nums}
.tile h3{margin:2px 0 0;font-size:18px;letter-spacing:-.02em;line-height:1.1}
.tile .mt{height:9px;border-radius:5px;background:rgba(0,0,0,.2);overflow:hidden;margin:7px 0 0}
.tile .mt i{display:block;height:100%;background:var(--fg);border-radius:5px}
.tile p{grid-column:1/-1;margin:10px 0 0;font-family:var(--serif);font-size:17px;line-height:1.45}
.duo{display:grid;gap:10px}
.note{background:var(--ink2);border-radius:20px;padding:14px 16px}
.note b{display:block;font-size:14px;color:var(--saf);margin-bottom:2px}
.note span{font-family:var(--serif);font-size:17px}
.tl{position:relative;padding-left:26px;border-left:3px solid var(--ink3);margin-left:8px}
.week{position:relative;margin-bottom:16px}
.week:before{content:"";position:absolute;left:-36px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--saf);border:4px solid var(--page)}
.week h3{margin:0;font-size:19px;letter-spacing:-.02em}
.week small{color:var(--mut);font-size:14px}
.week ul{list-style:none;margin:8px 0 0;padding:0}
.week li{background:var(--ink2);border-radius:14px;padding:10px 13px;margin-bottom:7px;font-family:var(--serif);font-size:16.5px;line-height:1.42;border-left:6px solid var(--lc,#fff)}
.refpanel{background:var(--paper);color:var(--ink);border-radius:24px;padding:16px 18px}
.refpanel .fine{color:var(--mutd)}
.pdfbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;margin-top:22px}
.pdfbar .btn{width:100%;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.sig{margin-top:26px;text-align:center;font-size:13px;color:var(--mut)}

/* professor */
#prof{position:fixed;left:0;bottom:calc(var(--navh) + 6px + env(safe-area-inset-bottom));width:84px;z-index:40;transform:translateX(12px);cursor:pointer;touch-action:manipulation}
#prof.walking{pointer-events:none}
#prof.noNavPos{bottom:calc(16px + env(safe-area-inset-bottom))}
#prof .flip{transform-origin:50% 100%;transition:transform .25s}
#prof .inner{animation:float 3.4s ease-in-out infinite}
#prof.walking .inner{animation:none}
#prof .tag2{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);background:#fff;color:var(--ink);font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap;pointer-events:none}
.prof-svg{display:block;width:84px;height:auto;overflow:visible}
.bub{position:absolute;bottom:calc(100% + 8px);left:50%;width:max-content;max-width:min(250px,calc(100vw - 24px));background:#fff;color:var(--ink);border-radius:18px;padding:10px 14px;font-size:15px;line-height:1.3;font-weight:600;opacity:0;transform:translate(-50%,6px) scale(.96);transition:opacity .2s,transform .2s;pointer-events:none;--tail:50%;box-shadow:0 6px 22px rgba(0,0,0,.35)}
.bub.on{opacity:1}
.bub:after{content:"";position:absolute;top:100%;left:var(--tail);margin-left:-7px;border:7px solid transparent;border-top-color:#fff}
.legL,.legR{transform-origin:50px 100px}
.armL{transform-origin:30px 60px}.armR{transform-origin:70px 60px}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.mouth{transform-box:fill-box;transform-origin:center}
#prof.walking .legL{animation:stepA .4s ease-in-out infinite alternate}
#prof.walking .legR{animation:stepA .4s ease-in-out infinite alternate-reverse}
#prof.walking .armL{animation:armS .4s ease-in-out infinite alternate-reverse}
#prof.walking .torso{animation:bob .2s ease-in-out infinite alternate}
#prof.hello .armR{animation:wave .45s ease-in-out 6 alternate}
#prof.talk .mouth{animation:talk .22s ease-in-out infinite alternate}
#prof.hop .inner{animation:hop .5s ease-out 1}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes stepA{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes armS{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes bob{to{transform:translateY(-2px)}}
@keyframes wave{from{transform:rotate(-135deg)}to{transform:rotate(-165deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes talk{to{transform:scaleY(1.7)}}
@keyframes hop{30%{transform:translateY(-22px)}60%{transform:translateY(0)}78%{transform:translateY(-7px)}}

/* chat */
.scrim{position:fixed;inset:0;background:rgba(5,4,14,.6);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:61;width:100%;max-width:600px;height:min(82vh,700px);background:var(--ink2);color:#fff;border-radius:28px 28px 0 0;display:flex;flex-direction:column;transform:translate(-50%,105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sh{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--ink);border-radius:28px 28px 0 0}
.sh svg{width:48px;height:46px;flex:none;background:var(--saf);border-radius:50%}
.sh b{display:block;font-size:18px;line-height:1.1;letter-spacing:-.01em}
.sh span{font-size:12.5px;color:var(--mut)}
.sh button{margin-left:auto;border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:50%;width:40px;height:40px;font-size:22px;cursor:pointer;line-height:1}
.msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.m{max-width:88%;padding:11px 14px;border-radius:20px;font-size:15.5px;line-height:1.42}
.m.bot{background:var(--paper);color:var(--ink);border-bottom-left-radius:6px;align-self:flex-start}
.m.me{background:var(--saf);color:var(--ink);font-weight:600;border-bottom-right-radius:6px;align-self:flex-end}
.m p{margin:0 0 6px}.m p:last-child{margin:0}
.m ul{margin:4px 0;padding-left:18px}
.m .rf{font-family:var(--serif);font-size:14.5px;margin:5px 0}
.m a{color:var(--ultra)}
.ctx{align-self:center;font-size:12.5px;font-weight:700;color:var(--mut);background:var(--ink3);border-radius:999px;padding:3px 12px}
.typing{display:flex;gap:4px;padding:13px 15px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-4px);opacity:.4}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--saf);border-color:var(--saf);color:var(--ink)}
.inp{display:flex;gap:8px;padding:8px 16px 14px}
.inp input{flex:1;border:2px solid rgba(255,255,255,.3);border-radius:999px;padding:12px 18px;background:var(--ink);color:#fff;font-size:16px;min-width:0}
.inp input:focus{border-color:var(--saf);outline:none}
.inp button{border:0;background:var(--saf);color:var(--ink);border-radius:50%;width:48px;height:48px;font-size:20px;cursor:pointer;flex:none;font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 22px);transform:translateX(-50%);background:var(--saf);color:var(--ink);padding:11px 18px;border-radius:999px;font-size:14.5px;font-weight:700;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}

@media (min-width:700px){ main{padding-top:40px} }
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .arc{stroke-dashoffset:0}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<header class="top hidden" id="top">
  <div class="wrap">
    <img class="logo-w" data-logo alt="Logo AB">
    <div class="ttl">Diagnóstico do TCC<small id="topSub">Prof. Dr. André Batalhão</small></div>
    <div class="cnt" id="cnt"></div>
  </div>
  <div class="spec" id="spec"></div>
</header>

<main id="main"><div class="wrap" id="view"></div></main>

<nav class="nav hidden" id="nav"><div class="wrap">
  <button class="btn ghost" id="bPrev" aria-label="Questão anterior">Voltar</button>
  <button class="btn" id="bNext">Próxima</button>
</div></nav>

<div id="prof" role="button" tabindex="0" aria-label="Abrir conversa com o Dr. Andrezinho, orientador virtual">
  <div class="bub" id="bub" role="status" aria-live="polite"></div>
  <div class="flip" id="flip"><div class="inner" id="profInner"></div></div>
  <span class="tag2">Dr. Andrezinho</span>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-label="Conversa com o Dr. Andrezinho" aria-hidden="true">
  <div class="sh">
    <div id="avatar"></div>
    <div><b>Dr. Andrezinho</b><span>Orientador virtual de TCC em Administração</span></div>
    <button id="closeChat" aria-label="Fechar conversa">×</button>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="inp" id="chatForm" autocomplete="off">
    <input id="chatIn" type="text" placeholder="Pergunte ao Dr. Andrezinho..." aria-label="Sua mensagem">
    <button type="submit" aria-label="Enviar">&#10148;</button>
  </form>
</section>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* =========================================================
   CONFIGURAÇÃO
   AI_ENDPOINT: opcional. Se você tiver um proxy seguro (ex.: Cloudflare Worker)
   que receba {pergunta, contexto} e devolva {resposta}, coloque a URL aqui.
   NUNCA coloque chaves de API neste arquivo: o GitHub é público.

function zone(){const vw=innerWidth,mx=vw-84-8;return S.view==="quiz"?[Math.round(vw*.58),mx]:[8,mx]}
function moveTo(x){
  const z=zone(); x=Math.max(z[0],Math.min(z[1],x));
  const dist=Math.abs(x-P.x); if(dist<10) return Promise.resolve();
  P.flip.style.transform=`scaleX(${x>P.x?1:-1})`;
  if(reduce){P.el.style.transform=`translateX(${x}px)`;P.x=x;return Promise.resolve()}
  const dur=dist/70;
  P.el.style.transition=`transform ${dur}s linear`;
  P.el.classList.add("walking");
  P.el.style.transform=`translateX(${x}px)`; P.x=x;
  return new Promise(r=>setTimeout(()=>{P.el.classList.remove("walking");P.flip.style.transform="scaleX(1)";r()},dur*1000));
}
function say(t,ms=5600){
  if(P.chat) return;
  const b=P.bub; b.textContent=t; b.classList.add("on");
  b.style.transform="translate(-50%,0) scale(1)";
  requestAnimationFrame(()=>{
    const w=b.offsetWidth,cx=P.x+42,l=cx-w/2,r=cx+w/2;let sh=0;
    if(l<10)sh=10-l;else if(r>innerWidth-10)sh=innerWidth-10-r;
    b.style.transform=`translate(calc(-50% + ${sh}px),0) scale(1)`;b.style.setProperty("--tail",`calc(50% - ${sh}px)`);
  });
  P.el.classList.add("talk"); clearTimeout(P.tm);
  setTimeout(()=>P.el.classList.remove("talk"),Math.min(ms,2400));
  P.tm=setTimeout(()=>{b.classList.remove("on");b.style.transform="translate(-50%,6px) scale(.96)"},ms);
}
function anim(c,ms){P.el.classList.remove(c);void P.el.offsetWidth;P.el.classList.add(c);setTimeout(()=>P.el.classList.remove(c),ms)}
function wander(){
  const next=()=>setTimeout(wander,6500+Math.random()*5000);
  if(reduce||P.chat||Date.now()<P.pause||document.hidden){next();return}
  const z=zone(),x=z[0]+Math.random()*(z[1]-z[0]);
  moveTo(x).then(()=>{ if(Math.random()<.35) say(idleLine()); });
  next();
}

/* ---------- Rosácea (gráfico principal) ---------- */
function drawRosette(cv,dim,total,th,p=1){
  const ctx=cv.getContext("2d"),S2=cv.width,c=S2/2,Rm=S2*.29,Ri=S2*.13,st=Math.PI/4,gap=.05;
  const F="'Bricolage Grotesque',Arial,sans-serif";
  ctx.clearRect(0,0,S2,S2);
  ctx.lineWidth=Math.max(1,S2*.0022);ctx.strokeStyle=th.ring;
  [0,.25,.5,.75,1].forEach(f=>{ctx.beginPath();ctx.arc(c,c,Ri+(Rm-Ri)*f,0,Math.PI*2);ctx.stroke()});
  dim.forEach((v,i)=>{
    const a0=-Math.PI/2+i*st+gap/2,a1=a0+st-gap,am=(a0+a1)/2;
    ctx.beginPath();ctx.arc(c,c,Rm,a0,a1);ctx.arc(c,c,Ri,a1,a0,true);ctx.closePath();ctx.fillStyle=th.track;ctx.fill();
    const r=Ri+(Rm-Ri)*(v/100)*p;
    if(v>0){ctx.beginPath();ctx.arc(c,c,r,a0,a1);ctx.arc(c,c,Ri,a1,a0,true);ctx.closePath();ctx.fillStyle=DCOL[i].c;ctx.fill()}
    const lr=Rm+S2*.045,cx=Math.cos(am),sy=Math.sin(am);
    ctx.fillStyle=th.text;ctx.font=`700 ${S2*.029}px ${F}`;
    ctx.textAlign=cx>.35?"left":cx<-.35?"right":"center";
    ctx.textBaseline=sy>.35?"top":sy<-.35?"bottom":"middle";
    ctx.fillText(DIMS[i].s,c+cx*lr,c+sy*lr);
  });
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=th.text;
  ctx.font=`800 ${S2*.08}px ${F}`;ctx.fillText(Math.round(total*p)+"%",c,c-S2*.006);
  ctx.fillStyle=th.muted;ctx.font=`600 ${S2*.025}px ${F}`;ctx.fillText("geral",c,c+S2*.052);
}
const TH_DARK={ring:"rgba(255,255,255,.16)",track:"rgba(255,255,255,.07)",text:"#fff",muted:"#B7B1D6"};
const TH_LIGHT={ring:"#D9D3EC",track:"#EEEAF7",text:"#0D0B1A",muted:"#5B5675"};
function animateRosette(cv,dim,total){
  if(reduce){drawRosette(cv,dim,total,TH_DARK,1);return}
  const t0=performance.now(),D=1100;
  const f=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);drawRosette(cv,dim,total,TH_DARK,e);if(k<1)requestAnimationFrame(f)};
  requestAnimationFrame(f);
}

$("#chatForm").onsubmit=e=>{e.preventDefault();const i=$("#chatIn");const t=i.value.trim();if(t){i.value="";ask(t)}};

async function ask(t){
  if(busy)return;busy=true;
  addMsg("me",esc(t));
  const typing=addMsg("bot typing","<i></i><i></i><i></i>");
  let html;
  try{html=await reply(t)}catch(e){html="<p>Tive um problema para responder agora. Tente reformular a pergunta.</p>"}
  await new Promise(r=>setTimeout(r,450+Math.random()*350));
  typing.remove();addMsg("bot",html);busy=false;
}
const P_=t=>`<p>${t}</p>`;
async function reply(raw){
  const t=norm(raw), q=S.view==="quiz"?Q[S.i]:null, has=re=>re.test(t);
  if(CONFIG.AI_ENDPOINT){
    try{const r=await fetch(CONFIG.AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pergunta:raw,contexto:{questao:q&&q.q,dimensao:q&&DIMS[q.d].n,nota:q&&S.ans[S.i],perfil:{tipo:S.profile.tipo,tema:S.profile.tema}}})});
      if(r.ok){const j=await r.json();if(j.resposta)return P_(esc(j.resposta).replace(/\n/g,"<br>"))}}catch(e){}
  }
  if(has(/^(oi|ola|bom dia|boa tarde|boa noite|e ai)\b/))return P_("Olá! Em que posso ajudar com o seu TCC hoje?");
  if(has(/obrigad|valeu|brigad/))return P_("Disponha! Lembre-se: bom TCC é reescrito várias vezes. Conte comigo.");
  if(S.view==="intro"){
    if(has(/qualitativ|misto|revisao/))return P_("Serve, sim! As questões cobrem pesquisas quantitativas, qualitativas, mistas e revisões. Onde o rigor muda, a questão traz as duas versões.");
    if(has(/tempo|quanto|minuto/))return P_("Cerca de 15 minutos. Seu progresso é salvo automaticamente neste aparelho.");
    return `<p>Este diagnóstico avalia o seu TCC em 8 dimensões (problema, teoria, revisão, modelo, método, dados, ética e discussão) com base em periódicos ABS 4/4*. Ao final, você recebe um relatório em PDF com gráficos e um plano de 4 semanas.</p>`;
  }
  if(S.view==="result"){
    const {dim,total}=scores(),g=gaps();
    if(has(/por onde|comec|priorid|primeiro/)){const x=g.slice(0,3);return x.length?`<p>Comece pelo que sustenta o resto do trabalho:</p><ul>${x.map(i=>`<li><b>Questão ${i.i+1} (${esc(DIMS[i.q.d].s)}):</b> ${esc(i.q.ac)}</li>`).join("")}</ul>`:P_("Você não tem pendências críticas. Foque a leitura crítica de colegas e do orientador.")}
    if(has(/subir|melhor|aumentar|nota/)){const d=dim.map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0])[0];return P_(`O maior ganho está em <b>${esc(DIMS[d[1]].n)}</b> (${d[0]}%). ${esc(dtxt(d[1],d[0]))} Use o plano de 4 semanas do relatório, na ordem proposta.`)}
    return P_(`Sua maturidade geral é de <b>${total}%</b>: <b>${esc(band(total)[1])}</b>. ${esc(band(total)[2])} Role a página para ver o diagnóstico por dimensão e baixe o PDF para levar ao seu orientador.`);
  }
  /* Tópicos gerais (com prioridade se a pergunta for claramente sobre eles) */
  const KB=[
   [/lacuna/,"<p>Lacuna não é “ninguém estudou”. É uma tensão, um pressuposto questionável ou uma condição que a literatura ignora (Alvesson & Sandberg, 2011). Monte uma tabela com artigos recentes e registre, para cada um, o que ele deixa de fora.</p>"],
   [/hipotese|proposic/,"<p>Uma boa hipótese traz direção, mecanismo e unidade de análise: “quanto maior X, maior Y, porque...”. O “porquê” vem da teoria (Bacharach, 1989).</p>"],
   [/amostra|tamanho|respondent|saturac/,"<p>Em estudos quantitativos, justifique o tamanho da amostra com poder estatístico (ferramentas como o G*Power ajudam). No qualitativo, justifique pela saturação ou por replicação teórica (Eisenhardt, 1989).</p>"],
   [/\babs\b|scopus|web of science|qualis|periodico|ft50/,"<p>O Academic Journal Guide (Chartered ABS) classifica periódicos de 1 a 4*. Priorize artigos de nível 3 a 4* e confirme a classificação na edição vigente. No Brasil, consulte também o Qualis da CAPES.</p>"],
   [/plagio|chatgpt|inteligencia artificial|\bia\b/,"<p>IA pode apoiar a organização de ideias, mas você é responsável por cada afirmação. Confira se cada referência existe, cite a fonte original e declare o uso conforme a regra da sua instituição.</p>"],
   [/orientador|banca/,"<p>Leve ao orientador uma versão curta e específica: pergunta, lacuna, contribuição e método em uma página. Reuniões objetivas rendem mais feedback.</p>"],
   [/prazo|cronograma|tempo/,"<p>Planeje de trás para frente: defina a data de entrega, reserve duas semanas para revisão e distribua o restante entre teoria, método, coleta, análise e redação. O plano de 4 semanas do relatório ajuda.</p>"],
   [/qualitativ/,"<p>Em pesquisa qualitativa, o rigor vem de mostrar como dados brutos viram conceitos (Gioia et al., 2013) e de relatar decisões de forma transparente (Aguinis & Solarino, 2019).</p>"],
   [/quantitativ|survey|regressao|sem\b/,"<p>Em estudos quantitativos, planeje antes da coleta: escalas validadas, tamanho da amostra, viés de método comum e técnica de análise (Hinkin, 1998; Podsakoff et al., 2012; Hair et al., 2019).</p>"]
  ];
  const explicit=has(/explic|exemplo|nota 4|erro|o que fazer|referenc|como me avalio|nivel/);
  if(!explicit||!q){for(const [re,a] of KB){if(has(re))return a}}
  if(q){
    const dn=DIMS[q.d].n;
    if(has(/exemplo|modelo de|como escrev|ilustr/))return `<p><b>Exemplo:</b></p><p>${esc(q.ex)}</p>`;
    if(has(/nota 4|nivel 4|pronto|consolid|evidenc|comprov|o que seria/))return `<p><b>Para marcar 4 (consolidado):</b></p><p>${esc(q.ev)}</p><p>Se você tem isso por escrito e já mostrou ao orientador, marque 4. Se falta evidência, marque 3.</p>`;
    if(has(/erro|errad|evit|cuidado|armadilha/))return `<p><b>Erro comum:</b></p><p>${esc(q.er)}</p>`;
    if(has(/o que fazer|como melhor|acao|proximo passo|baixo|ajuda para/))return `<p><b>Ação recomendada:</b></p><p>${esc(q.ac)}</p>`;
    if(has(/referenc|apa|artigo|autor|fonte|leitura|cita/))return `<p>Leituras sugeridas para esta questão:</p>${q.r.map(k=>`<div class="rf">${esc(REF[k].a)}<i>${esc(REF[k].j)}</i>${esc(REF[k].v)}${doiLink(REF[k])}</div>`).join("")}`;
    if(has(/como me avalio|qual nota|me dar|quanto|autoavali|nivel|marc/))return `<p>Use esta régua:</p><ul><li><b>0:</b> não comecei.</li><li><b>1:</b> tenho a ideia, sem registro escrito.</li><li><b>2:</b> há rascunho, mas falta evidência.</li><li><b>3:</b> está consistente, falta refinar e validar.</li><li><b>4:</b> ${esc(q.ev)}</li></ul><p>Na dúvida entre duas notas, marque a menor. O diagnóstico fica mais útil.</p>`;
    if(has(/explic|entend|significa|o que e|duvida|clarific|porque|por que|import/))return `<p><b>${esc(dn)}:</b> ${esc(q.why)}</p><p>Em resumo, a banca quer ver: ${esc(q.ev.charAt(0).toLowerCase()+q.ev.slice(1))}</p>`;
    for(const [re,a] of KB){if(has(re))return a}
    return `<p>Posso ajudar com esta questão de <b>${esc(dn)}</b>: explicar o que ela pede, dar um exemplo, mostrar o que seria nota 4, apontar erros comuns ou sugerir ações. Toque em uma das opções abaixo.</p>`;
  }
  return P_("Posso ajudar com as questões do diagnóstico. Escolha uma das opções abaixo.");
}

/* ---------- Utilidades ---------- */
function applyLogos(){document.querySelectorAll("img[data-logo]").forEach(i=>{if(!i.src||i.src.indexOf("data:")!==0)i.src=LOGO})}
(function(){const l=document.createElement("link");l.rel="icon";l.href=LOGO;document.head.appendChild(l)})();
addEventListener("resize",()=>{if(P.x>innerWidth-92)moveTo(innerWidth-92)});
if(S.view==="result"&&Object.keys(S.ans).length<Q.length)S.view="quiz";
render();
setTimeout(()=>{P.el.style.transform=`translateX(${P.x}px)`;
  if(S.view==="intro"){moveTo(innerWidth-100).then(()=>{say("Olá! Sou o Dr. Andrezinho. Toque em mim se precisar de ajuda.");anim("hello",2800)})}
},400);
setTimeout(wander,9000);
</script>
